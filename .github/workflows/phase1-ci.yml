name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: yatra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d yatra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/yatra_ci
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      BOOKING_WRITE_ENABLED: "false"
      PACKAGE_BOOKING_WRITE_ENABLED: "false"
      ADMIN_EMAIL: phase8-ci-admin@yatra.test
      ADMIN_PASSWORD: Phase8-CI-Admin-Only-2026!
      ADMIN_NAME: Phase 8 CI Admin
      E2E_OPERATIONS_EMAIL: phase8-ops@yatra.test
      E2E_OPERATIONS_PASSWORD: Phase8-Ops-Only-2026!
      E2E_OPERATIONS_NAME: Phase 8 Operations
      E2E_CUSTOMER_EMAIL: phase9-customer@yatra.test
      E2E_CUSTOMER_PASSWORD: Phase9-Customer-Only-2026!
      E2E_CUSTOMER_NAME: Phase 9 Customer
      E2E_ALLOW_INSECURE_CUSTOMER_COOKIE: "true"
      CUSTOMER_AUTH_WRITE_ENABLED: "false"
      E2E_ALLOW_INSECURE_ADMIN_COOKIE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma Schema
        run: npm run db:validate

      - name: Deploy CI database migrations
        run: npm run db:migrate:deploy -w @yatra/db

      - name: Seed canonical roles
        run: npm run db:seed:roles -w @yatra/db

      - name: Bootstrap disposable CI admin
        run: npm run db:bootstrap:admin -w @yatra/db

      - name: Bootstrap disposable operations admin
        run: npm run db:bootstrap:e2e-operations -w @yatra/db

      - name: Bootstrap booking assignment fixture
        run: npm run db:bootstrap:e2e-assignment -w @yatra/db

      - name: Bootstrap booking lifecycle fixture
        run: npm run db:bootstrap:e2e-lifecycle -w @yatra/db

      - name: Bootstrap refund permission fixture
        run: npm run db:bootstrap:e2e-refund -w @yatra/db

      - name: Bootstrap verified customer portal fixture
        run: npm run db:bootstrap:e2e-customer -w @yatra/db

      - name: Bootstrap email verification fixture
        run: npm run db:bootstrap:e2e-email-verification -w @yatra/db

      - name: Verify staff invite foundation
        run: npm run db:verify:staff-invites -w @yatra/db

      - name: Lint
        run: npm run lint

      - name: Typecheck Web
        run: npm run typecheck

      - name: Typecheck Domain
        run: npm run typecheck:domain

      - name: Typecheck Providers
        run: npm run typecheck:providers

      - name: Domain tests
        run: npm run test:domain

      - name: Provider tests
        run: npm run test:providers

      - name: Check readiness script syntax
        run: node --check scripts/verify-production-readiness.mjs

      - name: Payment runtime safety certification
        run: npm run verify:payment-runtime

      - name: Customer auth safety certification
        run: npm run verify:customer-auth

      - name: Notification foundation certification
        run: npm run verify:notifications

      - name: Production build
        run: npm run build

      - name: Admin form-system certification
        run: npm run verify:admin-forms

      - name: Admin route protection certification
        shell: bash
        run: |
          setsid npm run start -w @yatra/web -- --hostname 127.0.0.1 --port 3000 > /tmp/yatra-next.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill -- -"$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/admin/login > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/yatra-next.log
              exit 1
            fi
            sleep 1
          done
          ADMIN_SMOKE_BASE_URL=http://127.0.0.1:3000 npm run verify:admin-routes
          ADMIN_SMOKE_BASE_URL=http://127.0.0.1:3000 npm run verify:admin-authenticated
          ADMIN_SMOKE_BASE_URL=http://127.0.0.1:3000 npm run verify:admin-accessibility
          ADMIN_SMOKE_BASE_URL=http://127.0.0.1:3000 npm run verify:staff-invites

      - name: Reset CI login rate-limit buckets
        run: npm run db:reset:e2e-login-rate-limits -w @yatra/db

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser E2E certification
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          setsid npm run start -w @yatra/web -- --hostname 127.0.0.1 --port 3000 > /tmp/yatra-playwright.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill -- -"$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/admin/login > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/yatra-playwright.log
              exit 1
            fi
            sleep 1
          done
          if ! npm run test:e2e; then
            echo "=== Next.js server log ==="
            cat /tmp/yatra-playwright.log
            exit 1
          fi

