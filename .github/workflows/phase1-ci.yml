name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/yatra_ci
      NEXT_PUBLIC_APP_URL: https://example.com
      BOOKING_WRITE_ENABLED: "false"
      PACKAGE_BOOKING_WRITE_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma Schema
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck Web
        run: npm run typecheck

      - name: Typecheck Domain
        run: npm run typecheck:domain

      - name: Typecheck Providers
        run: npm run typecheck:providers

      - name: Domain tests
        run: npm run test:domain

      - name: Provider tests
        run: npm run test:providers

      - name: Check readiness script syntax
        run: node --check scripts/verify-production-readiness.mjs

      - name: Production build
        run: npm run build

      - name: Admin route protection certification
        shell: bash
        run: |
          npm run start -w @yatra/web -- --hostname 127.0.0.1 --port 3000 > /tmp/yatra-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/admin/login > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/yatra-next.log
              exit 1
            fi
            sleep 1
          done
          ADMIN_SMOKE_BASE_URL=http://127.0.0.1:3000 npm run verify:admin-routes
