name: Neon Migration Verify

on:
  push:
    branches: [main]
    paths:
      - "packages/db/prisma/**"
      - "packages/db/scripts/**"
      - "packages/db/package.json"
      - ".github/workflows/neon-migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-production-migration
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: yantra
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_EMAIL: admin@yatra.com
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_NAME: YATRA Super Admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require DATABASE_URL secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not available. Add it as an Environment secret in the yantra environment."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma Schema
        run: npm run db:validate

      - name: Deploy migrations
        run: npm run db:migrate:deploy -w @yatra/db

      - name: Seed canonical roles
        run: npm run db:seed:roles -w @yatra/db

      - name: Bootstrap super admin
        if: ${{ env.ADMIN_PASSWORD != '' }}
        run: npm run admin:bootstrap

      - name: Admin bootstrap guidance
        if: ${{ env.ADMIN_PASSWORD == '' }}
        run: echo "ADMIN_PASSWORD is not set. Add it as a yantra Environment secret and rerun this workflow to create admin@yatra.com."

      - name: Verify auth foundation
        run: npm run db:verify:auth -w @yatra/db

      - name: Verify CMS and SEO foundation
        run: npm run db:verify:cms -w @yatra/db

      - name: Verify fleet, driver and pricing foundation
        run: npm run db:verify:fleet -w @yatra/db

      - name: Verify car booking foundation
        run: npm run db:verify:booking -w @yatra/db

      - name: Verify booking policy foundation
        run: npm run db:verify:booking-policy -w @yatra/db

      - name: Verify booking database invariants
        run: npm run db:verify:booking-invariants -w @yatra/db

      - name: Verify package booking foundation
        run: npm run db:verify:package-booking -w @yatra/db

      - name: Verify payment foundation
        run: npm run db:verify:payments -w @yatra/db

      - name: Verify migration status
        run: npm run db:migrate:status -w @yatra/db
