name: Generate npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-npm-lockfile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile
        run: |
          test -f package-lock.json
          node -e "const p=require('./package-lock.json'); if (!p.lockfileVersion || p.lockfileVersion < 3) process.exit(1)"

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): add deterministic npm lockfile"
          git push origin HEAD:main
