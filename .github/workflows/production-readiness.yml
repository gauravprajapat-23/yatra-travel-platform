name: Production Readiness

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Production base URL, e.g. https://example.com"
        required: true
        type: string
      modes:
        description: "Comma-separated readiness scopes: core,car,package,payments,media,scheduled,customer,notifications,promotions,fleet,crm,full"
        required: true
        default: "core"
        type: string
      expected_commit:
        description: "Expected deployed commit SHA or prefix (recommended)"
        required: false
        type: string
      require_refunds:
        description: "Require refund writes/provider readiness"
        required: true
        default: false
        type: boolean
      require_password_reset:
        description: "Require customer password-reset readiness"
        required: true
        default: false
        type: boolean
      require_departures:
        description: "Require sellable package departure inventory"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify production readiness
        shell: bash
        env:
          PRODUCTION_URL: ${{ inputs.production_url }}
          READINESS_MODES: ${{ inputs.modes }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          REQUIRE_REFUNDS: ${{ inputs.require_refunds }}
          REQUIRE_PASSWORD_RESET: ${{ inputs.require_password_reset }}
          REQUIRE_DEPARTURES: ${{ inputs.require_departures }}
        run: |
          set -euo pipefail

          args=(--url "$PRODUCTION_URL" --modes "$READINESS_MODES")

          if [ -n "$EXPECTED_COMMIT" ]; then
            args+=(--expect-commit "$EXPECTED_COMMIT")
          fi

          if [ "$REQUIRE_REFUNDS" = "true" ]; then
            args+=(--require-refunds)
          fi

          if [ "$REQUIRE_PASSWORD_RESET" = "true" ]; then
            args+=(--require-password-reset)
          fi

          if [ "$REQUIRE_DEPARTURES" = "true" ]; then
            args+=(--require-departures)
          fi

          npm run certify:production-runtime -- "${args[@]}"
